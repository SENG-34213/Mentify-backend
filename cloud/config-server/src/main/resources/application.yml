server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:  classpath:/configuration/

# Register this config server with Eureka so microservices can discover it
# via service name ("config-server") instead of hardcoding localhost:8888.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: false   # config-server registers so others can discover it, but does not need the registry itself
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}