server:
  port: ${NOTIFICATION_SERVICE_PORT:8093}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8085}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8085/api/v1/auth/.well-known/jwks.json}
  datasource:
    url: jdbc:postgresql://${NOTIFICATION_DB_HOST:localhost}:${NOTIFICATION_DB_PORT:5432}/${NOTIFICATION_DB_NAME:notification_db}
    username: ${NOTIFICATION_DB_USERNAME:postgres}
    password: ${NOTIFICATION_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:30000}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${NOTIFICATION_KAFKA_GROUP_ID:notification-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:${SMTP_STARTTLS:false}}

mentify:
  security:
    enabled: true
    principal-claim: preferred_username
  notifications:
    kafka:
      enabled: ${NOTIFICATION_KAFKA_ENABLED:true}
      topic: ${NOTIFICATION_KAFKA_TOPIC:mentify.notification-events}
      group-id: ${NOTIFICATION_KAFKA_GROUP_ID:notification-service}
    email:
      from: ${SMTP_FROM:titeducation86@gmail.com}
      retry-delay-millis: ${NOTIFICATION_EMAIL_RETRY_DELAY_MILLIS:30000}
      max-attempts: ${NOTIFICATION_EMAIL_MAX_ATTEMPTS:5}
      retry-enabled: ${NOTIFICATION_EMAIL_RETRY_ENABLED:true}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port:${spring.application.instance_id:${random.value}}}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
