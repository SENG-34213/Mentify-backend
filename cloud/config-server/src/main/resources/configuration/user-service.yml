server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:titeducation86@gmail.com}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8085}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8085/api/v1/auth/.well-known/jwks.json}

  datasource:
    url: jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5432}/${USER_DB_NAME:user_db}
    username: ${USER_DB_USERNAME:postgres}
    password: ${USER_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:30000}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

mentify:
  auth:
    internal-token: ${AUTH_INTERNAL_TOKEN:change-me-internal-auth-token}
    service-url: ${AUTH_SERVICE_URL:http://localhost:8085}
  super-admin-bootstrap:
    enabled: ${MENTIFY_SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${MENTIFY_SUPER_ADMIN_EMAIL:}
    password: ${MENTIFY_SUPER_ADMIN_PASSWORD:}
    first-name: ${MENTIFY_SUPER_ADMIN_FIRST_NAME:System}
    last-name: ${MENTIFY_SUPER_ADMIN_LAST_NAME:Administrator}
    phone-number: ${MENTIFY_SUPER_ADMIN_PHONE_NUMBER:}
    address-line1: ${MENTIFY_SUPER_ADMIN_ADDRESS_LINE1:System address}
    city: ${MENTIFY_SUPER_ADMIN_CITY:Colombo}
    district: ${MENTIFY_SUPER_ADMIN_DISTRICT:Colombo}
    postal-code: ${MENTIFY_SUPER_ADMIN_POSTAL_CODE:}
    nic: ${MENTIFY_SUPER_ADMIN_NIC:}
  registration:
    email:
      from: ${SMTP_FROM:titeducation86@gmail.com}
      login-url: ${MENTIFY_LOGIN_URL:http://localhost:5173/login}
      student-login-url: ${MENTIFY_STUDENT_LOGIN_URL:${MENTIFY_LOGIN_URL:http://localhost:5173/login}}
      teacher-login-url: ${MENTIFY_TEACHER_LOGIN_URL:${MENTIFY_LOGIN_URL:http://localhost:5173/login}}
      admin-login-url: ${MENTIFY_ADMIN_LOGIN_URL:${MENTIFY_LOGIN_URL:http://localhost:5173/login}}
      retry-attempts: ${MENTIFY_WELCOME_EMAIL_RETRY_ATTEMPTS:2}
  security:
    enabled: true
    principal-claim: preferred_username

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port:${spring.application.instance_id:${random.value}}}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info



logging:
  level:
    root: INFO
    com.mentify: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
