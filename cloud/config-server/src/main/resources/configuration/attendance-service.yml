server:
  port: ${ATTENDANCE_SERVICE_PORT:8087}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/mentify}

  datasource:
    url: jdbc:postgresql://${ATTENDANCE_DB_HOST:localhost}:${ATTENDANCE_DB_PORT:5434}/${ATTENDANCE_DB_NAME:attendance_db}
    username: ${ATTENDANCE_DB_USERNAME:postgres}
    password: ${ATTENDANCE_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:30000}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

mentify:
  security:
    enabled: true
    principal-claim: preferred_username
  clients:
    calendar-service:
      url: ${CALENDAR_SERVICE_URL:}
      internal-service-token: ${CALENDAR_INTERNAL_SERVICE_TOKEN:}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port:${spring.application.instance_id:${random.value}}}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000

logging:
  level:
    root: INFO
    com.mentify: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
