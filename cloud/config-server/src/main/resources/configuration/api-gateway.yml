server:
  port: ${SERVER_PORT:8080}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port:${spring.application.instance_id:${random.value}}}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

mentify:
  gateway:
    cors:
      allowed-origin-patterns: ${GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
      allowed-methods: ${GATEWAY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
      allowed-headers: ${GATEWAY_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
      exposed-headers: ${GATEWAY_CORS_EXPOSED_HEADERS:Location}
      allow-credentials: ${GATEWAY_CORS_ALLOW_CREDENTIALS:true}
      max-age-seconds: ${GATEWAY_CORS_MAX_AGE_SECONDS:3600}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8085}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8085/api/v1/auth/.well-known/jwks.json}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/admin/users/**,/api/students/**,/api/teachers/**,/api/internal/users/analytics/**,/api/v1/internal/users/**
          filters:
            - StripPrefix=0

        - id: exam-service
          uri: lb://exam-service
          predicates:
            - Path=/api/v1/exams/**
          filters:
            - StripPrefix=0

        - id: calender-service
          uri: lb://calender-service
          predicates:
            - Path=/api/v1/calendar/**
          filters:
            - StripPrefix=0

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0

        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/api/v1/course/**

        - id: marketplace-catalog
          uri: lb://course-service
          predicates:
            - Path=/api/v1/marketplace/**
        - id: teacher-dashboard-course-service
          uri: lb://course-service
          predicates:
            - Path=/api/v1/teacher/**
          filters:
            - StripPrefix=0

        - id: teacher-course-service
          uri: lb://course-service
          predicates:
            - Path=/api/v1/teacher/**
          filters:
            - StripPrefix=0

        - id: material-service
          uri: lb://material-service
          predicates:
            - Path=/api/v1/materials,/api/v1/materials/**,/api/v1/profile-images,/api/v1/profile-images/**
          filters:
            - StripPrefix=0

        - id: entrollment-service
          uri: lb://entrollment-service
          predicates:
            - Path=/api/v1/enrollments/**
          filters:
            - StripPrefix=0

        - id: communication-service
          uri: lb://communication-service
          predicates:
            - Path=/api/communication/**
          filters:
            - StripPrefix=0

        - id: communication-service-websocket
          uri: lb:ws://communication-service
          predicates:
            - Path=/ws,/ws/**

        - id: assignment-service
          uri: lb://assignment-service
          predicates:
            - Path=/api/quizzes/**,/api/quiz-attempts/**,/api/courses/*/quizzes,/api/assignments/**,/api/v1/assignments/**,/api/v1/courses/*/assignments,/api/v1/submissions/**,/api/internal/quizzes/analytics/**
          filters:
            - StripPrefix=0

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=0

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=0

        - id: ai-service-v1-compat
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - RewritePath=/api/v1/ai/(?<segment>.*), /api/ai/$\{segment}

        - id: ai-service-websocket
          uri: lb:ws://ai-service
          predicates:
            - Path=/ws/ai,/ws/ai/**

        - id: attendance-service
          uri: lb://attendance-service
          predicates:
            - Path=/api/v1/attendance/**
          filters:
            - StripPrefix=0

logging:
  level:
    root: INFO
    # TRACE logs STOMP frames and can expose Authorization headers.
    org.springframework.cloud.gateway: INFO
    org.springframework.http.server.reactive: INFO
    org.springframework.web.reactive: INFO
    reactor.netty: WARN
