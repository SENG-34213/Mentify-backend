spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8085}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8085/api/v1/auth/.well-known/jwks.json}

mentify:
  security:
    audience: ${AUTH_AUDIENCE:mentify-api}
  gateway:
    cors:
      allowed-origin-patterns: ${GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
      allowed-methods: ${GATEWAY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
      allowed-headers: ${GATEWAY_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
      exposed-headers: ${GATEWAY_CORS_EXPOSED_HEADERS:Location}
      allow-credentials: ${GATEWAY_CORS_ALLOW_CREDENTIALS:true}
      max-age-seconds: ${GATEWAY_CORS_MAX_AGE_SECONDS:3600}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port:${spring.application.instance_id:${random.value}}}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

