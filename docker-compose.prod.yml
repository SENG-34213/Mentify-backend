name: mentify-prod

x-app: &app
  image: ${DOCKERHUB_IMAGE:?DOCKERHUB_IMAGE must be set}:${IMAGE_TAG:-latest}
  env_file:
    - "${MENTIFY_ENV_FILE:-.env.prod}"
  restart: unless-stopped
  networks:
    - backend

services:
  postgres:
    image: postgres:14-alpine
    env_file:
      - "${MENTIFY_ENV_FILE:-.env.prod}"
    environment:
      POSTGRES_USER: ${APP_DB_USERNAME:-mentify}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
      POSTGRES_DB: ${APP_DB_NAME:-mentify}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    env_file:
      - "${MENTIFY_ENV_FILE:-.env.prod}"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [backend]

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: ["kafka:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [backend]

  service-registry:
    <<: *app
    environment:
      SERVICE_JAR: service-registry.jar
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8761

  config-server:
    <<: *app
    environment:
      SERVICE_JAR: config-server.jar
      SPRING_PROFILES_ACTIVE: prod,native
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_IP: config-server
    depends_on:
      service-registry: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  auth-service:
    <<: *app
    environment:
      SERVICE_JAR: auth-service.jar
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_IP: auth-service
      AUTH_DB_HOST: postgres
      AUTH_JWK_SET_URI: http://auth-service:8085/api/v1/auth/.well-known/jwks.json
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      config-server: {condition: service_healthy}
      service-registry: {condition: service_started}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  api-gateway:
    <<: *app
    environment:
      SERVICE_JAR: api-gateway.jar
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_IP: api-gateway
      AUTH_JWK_SET_URI: http://auth-service:8085/api/v1/auth/.well-known/jwks.json
    depends_on:
      config-server: {condition: service_healthy}
      service-registry: {condition: service_started}
      auth-service: {condition: service_healthy}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    env_file:
      - "${MENTIFY_ENV_FILE:-.env.prod}"
    depends_on:
      api-gateway: {condition: service_healthy}
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - backend

  user-service:
    <<: *app
    environment: {SERVICE_JAR: user-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: user-service, USER_DB_HOST: postgres, AUTH_SERVICE_URL: "http://auth-service:8085"}
    depends_on: &business-depends
      config-server: {condition: service_healthy}
      service-registry: {condition: service_started}
      postgres: {condition: service_healthy}

  course-service:
    <<: *app
    environment: {SERVICE_JAR: course-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: course-service, COURSE_DB_HOST: postgres}
    depends_on: *business-depends

  entrollment-service:
    <<: *app
    environment: {SERVICE_JAR: entrollment-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: entrollment-service, ENTROLLMENT_DB_HOST: postgres}
    depends_on: *business-depends

  assignment-service:
    <<: *app
    environment: {SERVICE_JAR: assignment-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: assignment-service, ASSIGNMENT_DB_HOST: postgres, CALENDAR_SERVICE_URL: "http://calender-service:8092"}
    depends_on: *business-depends

  communication-service:
    <<: *app
    environment: {SERVICE_JAR: communication-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: communication-service, COMMUNICATION_DB_HOST: postgres}
    depends_on: *business-depends

  attendance-service:
    <<: *app
    environment: {SERVICE_JAR: attendance-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: attendance-service, ATTENDANCE_DB_HOST: postgres, CALENDAR_SERVICE_URL: "http://calender-service:8092"}
    depends_on: *business-depends

  exam-service:
    <<: *app
    environment: {SERVICE_JAR: exam-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: exam-service, EXAM_DB_HOST: postgres}
    depends_on: *business-depends

  material-service:
    <<: *app
    environment: {SERVICE_JAR: material-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: material-service, MATERIAL_DB_HOST: postgres, AWS_PROFILE: ""}
    depends_on: *business-depends

  calender-service:
    <<: *app
    environment: {SERVICE_JAR: calender-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: calender-service, CALENDER_DB_HOST: postgres}
    depends_on: *business-depends

  payment-service:
    <<: *app
    environment: {SERVICE_JAR: payment-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: payment-service, PAYMENT_DB_HOST: postgres}
    depends_on: *business-depends

  ai-service:
    <<: *app
    environment: {SERVICE_JAR: ai-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: ai-service, AI_DB_HOST: postgres}
    depends_on: *business-depends

  analytics-service:
    <<: *app
    environment: {SERVICE_JAR: analytics-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: analytics-service, ANALYTICS_DB_HOST: postgres}
    depends_on: *business-depends

  notification-service:
    <<: *app
    environment: {SERVICE_JAR: notification-service.jar, SPRING_PROFILES_ACTIVE: prod, CONFIG_SERVER_URL: "http://config-server:8888", EUREKA_URL: "http://service-registry:8761/eureka/", EUREKA_INSTANCE_IP: notification-service, NOTIFICATION_DB_HOST: postgres, KAFKA_BOOTSTRAP_SERVERS: "kafka:29092", NOTIFICATION_KAFKA_ENABLED: "true"}
    depends_on:
      <<: *business-depends
      kafka: {condition: service_healthy}

volumes:
  postgres:
  redis:
  kafka:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
