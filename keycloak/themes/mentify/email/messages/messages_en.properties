executeActionsSubject=Your Mentify account is ready - set your password
executeActionsBody=Welcome to Mentify! Your account has been created. Set a password to finish setting up your account and sign in:\n\n{0}\n\nThis secure link expires in {4}. If the link expires, request a new invitation from your administrator. If you were not expecting this email, you can ignore it.
executeActionsBodyHtml=<p style="margin:0 0 10px;font-size:12px;line-height:18px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#4f46e5;">Your account is ready</p><h1 style="margin:0 0 14px;font-size:27px;line-height:35px;font-weight:700;letter-spacing:-0.5px;color:#172033;">Welcome to Mentify</h1><p style="margin:0 0 26px;font-size:16px;line-height:26px;color:#4b5565;">Set a password to finish setting up your account and sign in to your learning workspace.</p><p style="margin:0 0 27px;"><a href="{0}" style="display:inline-block;background-color:#4f46e5;border:1px solid #4f46e5;border-radius:8px;padding:14px 24px;font-size:15px;line-height:20px;font-weight:700;color:#ffffff;text-decoration:none;">Set your password</a></p><p style="margin:0 0 9px;font-size:13px;line-height:20px;color:#667085;">Button not working? Copy this secure link into your browser:</p><p style="margin:0 0 24px;font-size:13px;line-height:20px;word-break:break-all;"><a href="{0}" style="color:#4338ca;text-decoration:underline;">{0}</a></p><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f7f8fc;border:1px solid #e8eaf2;border-radius:8px;"><tr><td style="padding:14px 16px;font-size:13px;line-height:20px;color:#5f6879;">For your security, this link expires in <strong style="color:#30394b;">{4}</strong>. If it expires, ask your administrator to send a new invitation.</td></tr></table><p style="margin:20px 0 0;font-size:13px;line-height:20px;color:#7a8498;">If you were not expecting this invitation, you can ignore this email. No changes will be made to your account.</p>
passwordResetSubject=Reset your Mentify password
passwordResetBody=We received a request to reset your Mentify password. Use the secure link below to choose a new one:\n\n{0}\n\nThis link expires in {3}. If you did not request a reset, ignore this email. Your current password will continue to work.
passwordResetBodyHtml=<p style="margin:0 0 10px;font-size:12px;line-height:18px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#4f46e5;">Account security</p><h1 style="margin:0 0 14px;font-size:27px;line-height:35px;font-weight:700;letter-spacing:-0.5px;color:#172033;">Reset your password</h1><p style="margin:0 0 26px;font-size:16px;line-height:26px;color:#4b5565;">We received a request to change the password for your Mentify account. Use the button below to choose a new one.</p><p style="margin:0 0 27px;"><a href="{0}" style="display:inline-block;background-color:#4f46e5;border:1px solid #4f46e5;border-radius:8px;padding:14px 24px;font-size:15px;line-height:20px;font-weight:700;color:#ffffff;text-decoration:none;">Reset password</a></p><p style="margin:0 0 9px;font-size:13px;line-height:20px;color:#667085;">Button not working? Copy this secure link into your browser:</p><p style="margin:0 0 24px;font-size:13px;line-height:20px;word-break:break-all;"><a href="{0}" style="color:#4338ca;text-decoration:underline;">{0}</a></p><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f7f8fc;border:1px solid #e8eaf2;border-radius:8px;"><tr><td style="padding:14px 16px;font-size:13px;line-height:20px;color:#5f6879;">For your security, this link expires in <strong style="color:#30394b;">{3}</strong>.</td></tr></table><p style="margin:20px 0 0;font-size:13px;line-height:20px;color:#7a8498;">If you did not request a password reset, ignore this email. Your current password will continue to work.</p>
