services:
  postgres:
    container_name: postgres_container_mentify
    image: postgres:14
    command: ["postgres", "-c", "max_connections=${APP_DB_MAX_CONNECTIONS:-200}"]
    profiles:
      - app-db
    environment:
      POSTGRES_USER: ${APP_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-change-me}
      PGDATA: /data/postgres
      POSTGRES_DB: ${APP_DB_NAME:-mentify}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      USER_DB_NAME: ${USER_DB_NAME:-user_db}
      COURSE_DB_NAME: ${COURSE_DB_NAME:-course_db}
      ENTROLLMENT_DB_NAME: ${ENTROLLMENT_DB_NAME:-entrollment_db}
      ASSIGNMENT_DB_NAME: ${ASSIGNMENT_DB_NAME:-assignment_db}
      COMMUNICATION_DB_NAME: ${COMMUNICATION_DB_NAME:-communication_db}
      ATTENDANCE_DB_NAME: ${ATTENDANCE_DB_NAME:-attendance_db}
      EXAM_DB_NAME: ${EXAM_DB_NAME:-exam_db}
      AI_DB_NAME: ${AI_DB_NAME:-ai_db}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      MATERIAL_DB_NAME: ${MATERIAL_DB_NAME:-material_db}
      CALENDER_DB_NAME: ${CALENDER_DB_NAME:-calender_db}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification_db}
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME:-analytics_db}
    volumes:
      - postgres:/data/postgres
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${APP_DB_PORT:-5432}:5432"
    networks:
      - backend
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin_container_mentify
    image: dpage/pgadmin4
    profiles:
      - app-db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - backend
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: mentify-kafka
    profiles:
      - notifications
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    networks:
      - backend
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mentify-mailpit
    profiles:
      - notifications
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - backend
    restart: unless-stopped

