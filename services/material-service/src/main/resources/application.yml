server:
  port: ${MATERIAL_SERVICE_PORT:8091}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: material-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  servlet:
    multipart:
      max-file-size: ${MATERIAL_MAX_FILE_SIZE:100MB}
      max-request-size: ${MATERIAL_MAX_REQUEST_SIZE:110MB}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8085}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8085/api/v1/auth/.well-known/jwks.json}
  datasource:
    url: jdbc:postgresql://${MATERIAL_DB_HOST:localhost}:${MATERIAL_DB_PORT:5432}/${MATERIAL_DB_NAME:material_db}
    username: ${MATERIAL_DB_USERNAME:postgres}
    password: ${MATERIAL_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:30000}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway owns schema changes. Hibernate must validate the migrated schema
      # instead of trying to add non-null columns to existing rows.
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

mentify:
  security:
    enabled: true
    principal-claim: preferred_username

material:
  storage:
    s3:
      bucket: ${MATERIAL_S3_BUCKET:mentify-materials-dev-unique123-193908537177-ap-south-1-an}
      region: ${AWS_REGION:${AWS_DEFAULT_REGION:ap-south-1}}
      download-url-expiration: ${MATERIAL_DOWNLOAD_URL_EXPIRATION:PT5M}
      profile: ${AWS_PROFILE:mentify-dev}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      session-token: ${AWS_SESSION_TOKEN:}
  validation:
    max-upload-size: ${MATERIAL_MAX_UPLOAD_SIZE:100MB}
    file-types:
      - material-type: PDF
        extensions: [pdf]
        content-types: [application/pdf]
      - material-type: DOCUMENT
        extensions: [doc]
        content-types: [application/msword]
      - material-type: DOCUMENT
        extensions: [docx]
        content-types: [application/vnd.openxmlformats-officedocument.wordprocessingml.document]
      - material-type: DOCUMENT
        extensions: [txt]
        content-types: [text/plain]
      - material-type: TEXT
        extensions: [md, markdown]
        content-types: [text/markdown, text/plain]
      - material-type: TEXT
        extensions: [csv]
        content-types: [text/csv, application/csv, text/plain]
      - material-type: TEXT
        extensions: [rtf]
        content-types: [application/rtf, text/rtf]
      - material-type: DOCUMENT
        extensions: [odt]
        content-types: [application/vnd.oasis.opendocument.text]
      - material-type: PRESENTATION
        extensions: [ppt]
        content-types: [application/vnd.ms-powerpoint]
      - material-type: PRESENTATION
        extensions: [pptx]
        content-types: [application/vnd.openxmlformats-officedocument.presentationml.presentation]
      - material-type: PRESENTATION
        extensions: [odp]
        content-types: [application/vnd.oasis.opendocument.presentation]
      - material-type: SPREADSHEET
        extensions: [xls]
        content-types: [application/vnd.ms-excel]
      - material-type: SPREADSHEET
        extensions: [xlsx]
        content-types: [application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
      - material-type: SPREADSHEET
        extensions: [ods]
        content-types: [application/vnd.oasis.opendocument.spreadsheet]
      - material-type: SPREADSHEET
        extensions: [csv]
        content-types: [text/csv, application/csv, text/plain]
      - material-type: IMAGE
        extensions: [jpg, jpeg]
        content-types: [image/jpeg]
      - material-type: IMAGE
        extensions: [png]
        content-types: [image/png]
      - material-type: IMAGE
        extensions: [gif]
        content-types: [image/gif]
      - material-type: IMAGE
        extensions: [webp]
        content-types: [image/webp]
      - material-type: IMAGE
        extensions: [svg]
        content-types: [image/svg+xml, text/xml]
      - material-type: VIDEO
        extensions: [mp4]
        content-types: [video/mp4]
      - material-type: VIDEO
        extensions: [mov]
        content-types: [video/quicktime]
      - material-type: VIDEO
        extensions: [webm]
        content-types: [video/webm]
      - material-type: AUDIO
        extensions: [webm]
        content-types: [audio/webm]
      - material-type: VIDEO
        extensions: [avi]
        content-types: [video/avi, video/x-msvideo]
      - material-type: AUDIO
        extensions: [mp3]
        content-types: [audio/mpeg]
      - material-type: AUDIO
        extensions: [wav]
        content-types: [audio/wav, audio/x-wav]
      - material-type: AUDIO
        extensions: [m4a]
        content-types: [audio/mp4]
      - material-type: AUDIO
        extensions: [ogg]
        content-types: [audio/ogg]
      - material-type: ARCHIVE
        extensions: [zip]
        content-types: [application/zip, application/x-zip-compressed]
      - material-type: ARCHIVE
        extensions: [7z]
        content-types: [application/x-7z-compressed]
      - material-type: ARCHIVE
        extensions: [rar]
        content-types: [application/vnd.rar, application/x-rar-compressed]

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port:${spring.application.instance_id:${random.value}}}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.mentify: INFO
