server:
  port: ${MATERIAL_SERVICE_PORT:8091}

spring:
  application:
    name: material-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/mentify}
  datasource:
    url: jdbc:postgresql://${MATERIAL_DB_HOST:localhost}:${MATERIAL_DB_PORT:5434}/${MATERIAL_DB_NAME:material_db}
    username: ${MATERIAL_DB_USERNAME:postgres}
    password: ${MATERIAL_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:30000}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

mentify:
  security:
    enabled: true
    principal-claim: preferred_username

material:
  storage:
    s3:
      bucket: ${MATERIAL_S3_BUCKET:}
      region: ${AWS_REGION:${AWS_DEFAULT_REGION:us-east-1}}
      download-url-expiration: ${MATERIAL_DOWNLOAD_URL_EXPIRATION:PT5M}
  validation:
    max-upload-size: ${MATERIAL_MAX_UPLOAD_SIZE:100MB}
    file-types:
      - material-type: PDF
        extensions: [pdf]
        content-types: [application/pdf]
      - material-type: DOCUMENT
        extensions: [doc]
        content-types: [application/msword]
      - material-type: DOCUMENT
        extensions: [docx]
        content-types: [application/vnd.openxmlformats-officedocument.wordprocessingml.document]
      - material-type: DOCUMENT
        extensions: [txt]
        content-types: [text/plain]
      - material-type: PRESENTATION
        extensions: [ppt]
        content-types: [application/vnd.ms-powerpoint]
      - material-type: PRESENTATION
        extensions: [pptx]
        content-types: [application/vnd.openxmlformats-officedocument.presentationml.presentation]
      - material-type: SPREADSHEET
        extensions: [xls]
        content-types: [application/vnd.ms-excel]
      - material-type: SPREADSHEET
        extensions: [xlsx]
        content-types: [application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
      - material-type: IMAGE
        extensions: [jpg, jpeg]
        content-types: [image/jpeg]
      - material-type: IMAGE
        extensions: [png]
        content-types: [image/png]
      - material-type: IMAGE
        extensions: [gif]
        content-types: [image/gif]
      - material-type: IMAGE
        extensions: [webp]
        content-types: [image/webp]
      - material-type: VIDEO
        extensions: [mp4]
        content-types: [video/mp4]
      - material-type: VIDEO
        extensions: [mov]
        content-types: [video/quicktime]
      - material-type: VIDEO
        extensions: [webm]
        content-types: [video/webm]
      - material-type: AUDIO
        extensions: [mp3]
        content-types: [audio/mpeg]
      - material-type: AUDIO
        extensions: [wav]
        content-types: [audio/wav, audio/x-wav]
      - material-type: AUDIO
        extensions: [m4a]
        content-types: [audio/mp4]
      - material-type: AUDIO
        extensions: [ogg]
        content-types: [audio/ogg]

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port:${spring.application.instance_id:${random.value}}}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.mentify: INFO
