spring:
  flyway:
    enabled: false
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:material_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

management:
  health:
    redis:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/mentify

eureka:
  client:
    enabled: false

mentify:
  security:
    enabled: true
    principal-claim: preferred_username

material:
  storage:
    s3:
      bucket: material-service-test-bucket
      region: us-east-1
      download-url-expiration: PT2M
