spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: analytics-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8085}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8085/api/v1/auth/.well-known/jwks.json}
  datasource:
    url: jdbc:postgresql://${ANALYTICS_DB_HOST:localhost}:${ANALYTICS_DB_PORT:5432}/${ANALYTICS_DB_NAME:analytics_db}
    username: ${ANALYTICS_DB_USERNAME:${APP_DB_USERNAME:postgres}}
    password: ${ANALYTICS_DB_PASSWORD:${APP_DB_PASSWORD:root}}
  jpa:
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${ANALYTICS_SERVICE_PORT:8095}

mentify:
  security:
    enabled: true
    principal-claim: preferred_username

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port:${random.value}}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.mentify: INFO
