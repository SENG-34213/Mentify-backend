spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085
          jwk-set-uri: http://localhost:8085/api/v1/auth/.well-known/jwks.json
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:analytics_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

eureka:
  client:
    enabled: false

mentify:
  security:
    enabled: true

management:
  endpoint:
    health:
      show-details: never
