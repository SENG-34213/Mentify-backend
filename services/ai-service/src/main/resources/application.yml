spring:
  application:
    name: ai-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/mentify}
 
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
 
mentify:
  security:
    enabled: true
    principal-claim: preferred_username
 
ai:
  provider:
    name: ${AI_PROVIDER:openai}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3-flash-preview}
  openai:
    api-key: ${OPENAI_API_KEY:${AI_API_KEY:}}
    model: ${OPENAI_MODEL:${AI_MODEL:gpt-4o}}
  http:
    connect-timeout: ${AI_HTTP_CONNECT_TIMEOUT:5s}
    read-timeout: ${AI_HTTP_READ_TIMEOUT:60s}
  retry:
    enabled: ${AI_RETRY_ENABLED:true}
    max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
    backoff: ${AI_RETRY_BACKOFF:500ms}
  circuit-breaker:
    enabled: ${AI_CIRCUIT_BREAKER_ENABLED:true}
    failure-threshold: ${AI_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
    open-duration: ${AI_CIRCUIT_BREAKER_OPEN_DURATION:30s}
  guardrails:
    max-requests-per-minute: ${AI_MAX_REQUESTS_PER_MINUTE:10}
    max-requests-per-day: ${AI_MAX_REQUESTS_PER_DAY:100}
    max-input-characters: ${AI_MAX_INPUT_CHARACTERS:12000}
    prompt-injection-detection-enabled: ${AI_PROMPT_INJECTION_DETECTION_ENABLED:true}
    content-filtering-enabled: ${AI_CONTENT_FILTERING_ENABLED:true}
    blocked-terms: ${AI_BLOCKED_TERMS:}
