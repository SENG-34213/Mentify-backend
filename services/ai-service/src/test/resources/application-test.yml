spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/mentify
 
eureka:
  client:
    enabled: false
 
mentify:
  security:
    enabled: true
    principal-claim: preferred_username
 
ai:
  provider:
    name: openai
    api-key: test-key
    model: gpt-4o
