spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:ai_service_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

management:
  health:
    redis:
      enabled: false
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085
 
eureka:
  client:
    enabled: false
 
mentify:
  security:
    enabled: true
    principal-claim: preferred_username
 
ai:
  provider:
    name: openai
    api-key: test-key
    model: gpt-4o
