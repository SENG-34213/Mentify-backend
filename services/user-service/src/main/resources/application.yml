spring:
  data:
    web:
      pageable:
        max-page-size: 50
        default-page-size: 20
  application:
    name: user-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/mentify}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

mentify:
  security:
    enabled: true
    principal-claim: preferred_username
  sample-users:
    enabled: ${MENTIFY_SAMPLE_USERS_ENABLED:false}
    users-per-role: ${MENTIFY_SAMPLE_USERS_PER_ROLE:5}
    email-domain: ${MENTIFY_SAMPLE_USERS_EMAIL_DOMAIN:mentify.test}
    password: ${MENTIFY_SAMPLE_USERS_PASSWORD:Sample@12345}
    reset-password-on-startup: ${MENTIFY_SAMPLE_USERS_RESET_PASSWORD:true}
    retry-attempts: ${MENTIFY_SAMPLE_USERS_RETRY_ATTEMPTS:10}
    retry-delay-millis: ${MENTIFY_SAMPLE_USERS_RETRY_DELAY_MILLIS:2000}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:mentify}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:${KEYCLOAK_BACKEND_CLIENT_ID:mentify-backend-client}}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:${KEYCLOAK_BACKEND_CLIENT_SECRET:change-me}}
  auth-client-id: ${KEYCLOAK_AUTH_CLIENT_ID:${KEYCLOAK_BACKEND_CLIENT_ID:mentify-backend-client}}
  auth-client-secret: ${KEYCLOAK_AUTH_CLIENT_SECRET:${KEYCLOAK_BACKEND_CLIENT_SECRET:change-me}}
  include-refresh-token-in-login-response: ${KEYCLOAK_INCLUDE_REFRESH_TOKEN_IN_LOGIN_RESPONSE:true}
  bootstrap-super-admin:
    enabled: ${KEYCLOAK_BOOTSTRAP_SUPER_ADMIN_ENABLED:true}
    email: ${KEYCLOAK_BOOTSTRAP_SUPER_ADMIN_EMAIL:superadmin@gmail.com}
    password: ${KEYCLOAK_BOOTSTRAP_SUPER_ADMIN_PASSWORD:SuperAdmin@123}
    first-name: ${KEYCLOAK_BOOTSTRAP_SUPER_ADMIN_FIRST_NAME:Super}
    last-name: ${KEYCLOAK_BOOTSTRAP_SUPER_ADMIN_LAST_NAME:Admin}
    reset-password-on-startup: ${KEYCLOAK_BOOTSTRAP_SUPER_ADMIN_RESET_PASSWORD:true}
    retry-attempts: ${KEYCLOAK_BOOTSTRAP_SUPER_ADMIN_RETRY_ATTEMPTS:10}
    retry-delay-millis: ${KEYCLOAK_BOOTSTRAP_SUPER_ADMIN_RETRY_DELAY_MILLIS:2000}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port:${spring.application.instance_id:${random.value}}}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
