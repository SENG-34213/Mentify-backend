spring:
  data:
    web:
      pageable:
        max-page-size: 50
        default-page-size: 20
  application:
    name: user-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:mohanathasholins17@gmail.com}
    password: ${SMTP_PASSWORD:pknd sjdn ksdq vetj}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8085}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8085/api/v1/auth/.well-known/jwks.json}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

mentify:
  auth:
    internal-token: ${AUTH_INTERNAL_TOKEN:change-me-internal-auth-token}
    service-url: ${AUTH_SERVICE_URL:http://localhost:8085}
  super-admin-bootstrap:
    enabled: ${MENTIFY_SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${MENTIFY_SUPER_ADMIN_EMAIL:}
    password: ${MENTIFY_SUPER_ADMIN_PASSWORD:}
    first-name: ${MENTIFY_SUPER_ADMIN_FIRST_NAME:System}
    last-name: ${MENTIFY_SUPER_ADMIN_LAST_NAME:Administrator}
    phone-number: ${MENTIFY_SUPER_ADMIN_PHONE_NUMBER:}
    address-line1: ${MENTIFY_SUPER_ADMIN_ADDRESS_LINE1:System address}
    city: ${MENTIFY_SUPER_ADMIN_CITY:Colombo}
    district: ${MENTIFY_SUPER_ADMIN_DISTRICT:Colombo}
    postal-code: ${MENTIFY_SUPER_ADMIN_POSTAL_CODE:}
    nic: ${MENTIFY_SUPER_ADMIN_NIC:}
  registration:
    email:
      from: ${SMTP_FROM:mohanathasholins17@gmail.com}
      login-url: ${MENTIFY_LOGIN_URL:http://localhost:5173/login}
      retry-attempts: ${MENTIFY_WELCOME_EMAIL_RETRY_ATTEMPTS:2}
  security:
    enabled: true
    principal-claim: preferred_username
    audience: ${AUTH_AUDIENCE:mentify-api}
  sample-users:
    enabled: ${MENTIFY_SAMPLE_USERS_ENABLED:false}
    users-per-role: ${MENTIFY_SAMPLE_USERS_PER_ROLE:5}
    email-domain: ${MENTIFY_SAMPLE_USERS_EMAIL_DOMAIN:mentify.test}
    password: ${MENTIFY_SAMPLE_USERS_PASSWORD:Sample@12345}
    reset-password-on-startup: ${MENTIFY_SAMPLE_USERS_RESET_PASSWORD:true}
    retry-attempts: ${MENTIFY_SAMPLE_USERS_RETRY_ATTEMPTS:10}
    retry-delay-millis: ${MENTIFY_SAMPLE_USERS_RETRY_DELAY_MILLIS:2000}


eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port:${spring.application.instance_id:${random.value}}}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
